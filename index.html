<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Snake</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #111; color: #eee; font-family: system-ui, sans-serif; }
  canvas { background: #000; border: 2px solid #444; }
  #score { text-align: center; font-size: 1.2rem; margin-bottom: 8px; }
</style>
</head>
<body>
<div>
  <div id="score">Score: 0</div>
  <canvas id="game" width="400" height="400"></canvas>
</div>
<script>
const ctx = document.getElementById('game').getContext('2d');
const scoreEl = document.getElementById('score');
const GRID = 20, CELL = 20, SNAKE_COLOR = '#39f';
let snake, dir, nextDir, food, score;

function reset() {
  snake = [{ x: 10, y: 10 }];
  dir = nextDir = { x: 1, y: 0 };
  score = 0;
  placeFood();
}

function placeFood() {
  do {
    food = { x: Math.floor(Math.random() * GRID), y: Math.floor(Math.random() * GRID) };
  } while (snake.some(s => s.x === food.x && s.y === food.y));
}

const KEYS = {
  ArrowUp: { x: 0, y: -1 }, w: { x: 0, y: -1 },
  ArrowDown: { x: 0, y: 1 }, s: { x: 0, y: 1 },
  ArrowLeft: { x: -1, y: 0 }, a: { x: -1, y: 0 },
  ArrowRight: { x: 1, y: 0 }, d: { x: 1, y: 0 },
};

document.addEventListener('keydown', e => {
  const d = KEYS[e.key];
  if (!d) return;
  e.preventDefault();
  if (d.x === -dir.x && d.y === -dir.y) return; // no reversing into yourself
  nextDir = d;
});

function tick() {
  dir = nextDir;
  const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
  const dead = head.x < 0 || head.y < 0 || head.x >= GRID || head.y >= GRID ||
    snake.some(s => s.x === head.x && s.y === head.y);
  if (dead) { reset(); return; }
  snake.unshift(head);
  if (head.x === food.x && head.y === food.y) { score++; placeFood(); } else { snake.pop(); }
}

function draw() {
  ctx.clearRect(0, 0, 400, 400);
  ctx.fillStyle = '#c33';
  ctx.fillRect(food.x * CELL, food.y * CELL, CELL, CELL);
  ctx.fillStyle = SNAKE_COLOR;
  snake.forEach(s => ctx.fillRect(s.x * CELL, s.y * CELL, CELL - 1, CELL - 1));
  scoreEl.textContent = 'Score: ' + score;
}

reset();
setInterval(() => { tick(); draw(); }, 120);
</script>
</body>
</html>
